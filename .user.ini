; PHP settings for NPad.
;
; These were previously php_value directives in .htaccess, which fatal the
; entire site under PHP-FPM/CGI. .user.ini is honoured by PHP-FPM per
; directory and is the correct home for them on shared hosting.

upload_max_filesize = 5M
post_max_size = 5M

expose_php = Off
display_errors = Off
log_errors = On

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.use_only_cookies = 1
