<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آفلاین — ان‌پد</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
    :root { color-scheme: light dark; }
    body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background: #eef1f5;
        color: #3f4a5c;
        font: 16px/1.9 Tahoma, Vazirmatn, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #0b1120; color: #d3dae6; }
        h1 { color: #f1f5f9 !important; }
        .card { background: #151d2e !important; border-color: #2b374c !important; }
    }
    .card {
        max-width: 460px;
        padding: 40px 32px;
        border: 1px solid #c8d0dc;
        border-radius: 16px;
        background: #fff;
    }
    h1 { margin: 0 0 12px; font-size: 22px; color: #0f172a; }
    p { margin: 0 0 24px; }
    a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 10px;
        background: #0e7490;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>اتصال برقرار نیست</h1>
        <p>در حال حاضر به ان‌پد دسترسی نداریم. یادداشت ذخیره‌شدهٔ شما همچنان روی همین دستگاه نگه داشته می‌شود و پس از اتصال مجدد در دسترس خواهد بود.</p>
        <a href="/fa/">تلاش دوباره</a>
    </div>
</body>
</html>
