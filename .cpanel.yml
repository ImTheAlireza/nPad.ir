deployment:
  tasks:
    - export DEPLOYPATH=/home/gniwvzcf/public_html/
    # Preserve the git-ignored config.php across deploys.
    - /bin/cp -a $DEPLOYPATH/config.php /home/gniwvzcf/config_backup.php 2>/dev/null || true
    # Explicit allow-list: dev tooling (docs/, tools/, tests/, node_modules,
    # *.mjs) and the rest of the checkout must never land in public_html.
    # The previous recursive wildcard copy shipped everything present in the
    # checkout. assets/ carries CSS, JS, fonts (incl. KaTeX), icons and the
    # OG image.
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R includes lang api admin fa $DEPLOYPATH
    - /bin/cp online-notepad.php markdown-editor.php math-notepad.php checklist-app.php text-editor.php word-counter.php rich-text-editor.php compare.php $DEPLOYPATH
    - /bin/cp index.php privacy.php 404.php sitemap.php offline.html sw.js robots.txt site.webmanifest .htaccess .user.ini $DEPLOYPATH
    - /bin/cp -a /home/gniwvzcf/config_backup.php $DEPLOYPATH/config.php 2>/dev/null || true
